<script>
const root=document.getElementById('root');

  extender(punto,fn){(this._ext[punto]||=[]).push(fn);},

  await Promise.all(lista.filter(p=>!DECA.cargados.has(p.id)).map(async p=>{
    DECA.cargados.add(p.id);
    p.estilos.forEach(h=>{const l=document.createElement('link');l.rel='stylesheet';l.href=h;document.head.appendChild(l);});

  }));
}

// ================= Seguridad de la cuenta: passkeys, recuperación por WhatsApp y teléfono =================
const b64u={
  aBuf:s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer},
  deBuf:buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
};
const passkeysDisponibles=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
const errorPasskey=e=>e?.name==='NotAllowedError'?'Se ha cancelado o ha caducado la solicitud de passkey.':e?.name==='InvalidStateError'?'Este dispositivo ya tiene una passkey de tu cuenta.':e?.name==='SecurityError'?'Las passkeys solo funcionan desde la dirección oficial de la aplicación (HTTPS).':(e?.message||'No se pudo usar la passkey.');
async function crearPasskey(){
  const o=await api('/api/passkeys/registro/opciones',{method:'POST',body:{}});
  const pub={...o,challenge:b64u.aBuf(o.challenge),user:{...o.user,id:b64u.aBuf(o.user.id)},excludeCredentials:(o.excludeCredentials||[]).map(c=>({...c,id:b64u.aBuf(c.id)}))};
  let c;try{c=await navigator.credentials.create({publicKey:pub});}catch(e){throw new Error(errorPasskey(e))}
  const r=c.response;
  const respuesta={id:c.id,rawId:b64u.deBuf(c.rawId),type:c.type,clientExtensionResults:c.getClientExtensionResults?.()||{},authenticatorAttachment:c.authenticatorAttachment||undefined,
    response:{clientDataJSON:b64u.deBuf(r.clientDataJSON),attestationObject:b64u.deBuf(r.attestationObject),transports:r.getTransports?.()||[]}};
  return api('/api/passkeys/registro/verificar',{method:'POST',body:{respuesta}});
}
async function entrarConPasskey(){
  const {id,opciones:o}=await api('/api/passkeys/acceso/opciones',{method:'POST',body:{}});
  let c;try{c=await navigator.credentials.get({publicKey:{...o,challenge:b64u.aBuf(o.challenge),allowCredentials:[]}});}catch(e){throw new Error(errorPasskey(e))}
  const r=c.response;
  const respuesta={id:c.id,rawId:b64u.deBuf(c.rawId),type:c.type,clientExtensionResults:c.getClientExtensionResults?.()||{},authenticatorAttachment:c.authenticatorAttachment||undefined,
    response:{clientDataJSON:b64u.deBuf(r.clientDataJSON),authenticatorData:b64u.deBuf(r.authenticatorData),signature:b64u.deBuf(r.signature),userHandle:r.userHandle?b64u.deBuf(r.userHandle):undefined}};
  return api('/api/passkeys/acceso/verificar',{method:'POST',body:{id,respuesta}});
}
// Campo de código de 6 cifras: admite pegar el código o que el móvil lo sugiera
const codigoHtml=(id='codigo')=>`<label class="field"><span>Código de 6 cifras</span><input id="${id}" class="input mono" inputmode="numeric" autocomplete="one-time-code" maxlength="7" pattern="[0-9 ]*" placeholder="000000" style="font-size:22px;letter-spacing:.3em;text-align:center"></label>`;
const limpiaCodigo=v=>String(v||'').replace(/\D/g,'').slice(0,6);
// Botón de reenvío con cuenta atrás de 60 s
function cuentaAtras(btn,seg=60){let s=seg;btn.disabled=true;const t0=btn.dataset.txt||btn.textContent;btn.dataset.txt=t0;const tick=()=>{if(!btn.isConnected)return clearInterval(iv);if(s<=0){clearInterval(iv);btn.disabled=false;btn.textContent=t0;return}btn.textContent=`${t0} (${s--} s)`};const iv=setInterval(tick,1000);tick();}
const pwReqsHtml=()=>`<div class="pw-meter"><div class="pw-meter-bar" id="pwBar"></div></div><div class="pw-reqs" id="pwReqs"></div>`;
function vigilarClave(input){const reqs=[[v=>v.length>=10,'Mínimo 10 caracteres'],[v=>/[A-Z]/.test(v),'Al menos 1 mayúscula'],[v=>/[a-z]/.test(v),'Al menos 1 minúscula'],[v=>/[0-9]/.test(v),'Al menos 1 número'],[v=>/[^A-Za-z0-9]/.test(v),'Al menos 1 símbolo especial']];
  const pinta=()=>{const v=input.value,ok=reqs.map(([f])=>f(v)),n=ok.filter(Boolean).length;document.getElementById('pwReqs').innerHTML=reqs.map(([,l],i)=>`<div class="pw-req${ok[i]?' ok':''}">${ok[i]?'✓':'○'} ${l}</div>`).join('');const bar=document.getElementById('pwBar');bar.style.width=(n/5*100)+'%';bar.style.backgroundColor=n<=2?'#bd3f46':n<=4?'#b78120':'#2e8b66'};
  input.addEventListener('input',pinta);pinta();}
const claveValida=v=>v.length>=10&&/[A-Z]/.test(v)&&/[a-z]/.test(v)&&/[0-9]/.test(v)&&/[^A-Za-z0-9]/.test(v);

// Recuperación de la contraseña (dentro de la tarjeta de inicio de sesión)
function pasoRecuperar(usuarioInicial,volver){

  document.querySelector('.login-title').textContent='Restablecer contraseña';

  const atras=`<div class="small muted" style="margin-bottom:12px"><button type="button" class="btn-ghost btn-small" id="recBack">${I('back')} Volver a iniciar sesión</button></div>`;
  const bindAtras=()=>document.getElementById('recBack').onclick=volver;
  const p1=()=>{caja.innerHTML=`<form id="recF1">${atras}<label class="field"><span>Usuario</span><input id="recUser" class="input" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(user)}"></label><div id="recErr" class="error" aria-live="polite"></div><div class="mt4"><button class="btn-primary full" type="submit">${I('phone')} Enviarme el código por WhatsApp</button></div></form>`;bindAtras();
    const f=document.getElementById('recF1'),inp=document.getElementById('recUser'),err=document.getElementById('recErr');inp.focus();
    f.onsubmit=async e=>{e.preventDefault();err.textContent='';user=inp.value.trim().toLowerCase();if(!user){err.textContent='Escribe tu nombre de usuario.';return}const b=f.querySelector('button[type=submit]');b.disabled=true;try{await api('/api/recuperar/solicitar',{method:'POST',body:{usuario:user}});p2(true);}catch(x){err.textContent=x.message;b.disabled=false}};};
  const p2=(recien)=>{caja.innerHTML=`<form id="recF2">${atras}<div class="alert info small" style="margin-bottom:14px">Si <strong>${esc(user)}</strong> tiene un teléfono verificado, acabas de recibir un WhatsApp con el código. Caduca en 10 minutos.</div>${codigoHtml('recCod')}<div id="recErr" class="error" aria-live="polite"></div><div class="mt4"><button class="btn-primary full" type="submit">Continuar ${I('arrow')}</button></div><div class="mt4" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><button type="button" class="btn-ghost btn-small" id="recResend">Reenviar código</button><span class="small muted" style="align-self:center">¿No te llega? Avisa al administrador.</span></div></form>`;bindAtras();
    const f=document.getElementById('recF2'),inp=document.getElementById('recCod'),err=document.getElementById('recErr'),rs=document.getElementById('recResend');inp.focus();if(recien)cuentaAtras(rs);
    inp.addEventListener('input',()=>{const v=limpiaCodigo(inp.value);if(v.length===6&&inp.value.replace(/\D/g,'')===v)f.requestSubmit()});
    rs.onclick=async()=>{err.textContent='';try{await api('/api/recuperar/solicitar',{method:'POST',body:{usuario:user}});toast('Código reenviado por WhatsApp');cuentaAtras(rs);}catch(x){err.textContent=x.message}};
    f.onsubmit=async e=>{e.preventDefault();err.textContent='';codigo=limpiaCodigo(inp.value);if(codigo.length!==6){err.textContent='El código tiene 6 cifras.';return}try{await api('/api/recuperar/comprobar',{method:'POST',body:{usuario:user,codigo}});p3();}catch(x){err.textContent=x.message;inp.select()}};};
  const p3=()=>{caja.innerHTML=`<form id="recF3">${atras}<label class="field"><span>Nueva contraseña</span><input id="recPw" type="password" class="input" autocomplete="new-password"></label>${pwReqsHtml()}<label class="field mt4"><span>Repite la contraseña</span><input id="recPw2" type="password" class="input" autocomplete="new-password"></label><div id="recErr" class="error" aria-live="polite"></div><div class="mt4"><button class="btn-primary full" type="submit">${I('save')} Guardar y entrar</button></div></form>`;bindAtras();
    const f=document.getElementById('recF3'),a=document.getElementById('recPw'),b=document.getElementById('recPw2'),err=document.getElementById('recErr');vigilarClave(a);a.focus();
    f.onsubmit=async e=>{e.preventDefault();err.textContent='';if(!claveValida(a.value)){err.textContent='La contraseña debe cumplir todos los requisitos.';a.focus();return}if(a.value!==b.value){err.textContent='Las contraseñas no coinciden.';b.focus();return}
      try{await api('/api/recuperar/confirmar',{method:'POST',body:{usuario:user,codigo,clave:a.value,claveConfirm:b.value}});toast('Contraseña restablecida. Ya has entrado.');await bootstrap(true);}catch(x){err.textContent=x.message;if(/código/i.test(x.message))setTimeout(()=>p2(false),1800)}};};
  p1();
}

// Tras entrar con contraseña, propone crear una passkey (como mucho una vez cada 30 días por navegador)
function ofrecerPasskey(){
  if(!passkeysDisponibles()||!state.user||state.user.passkeys>0||state.user.verificar_telefono)return;
  let ultima=0;try{ultima=Number(localStorage.getItem('deca-oferta-passkey')||0)}catch{}
  if(Date.now()-ultima<30*864e5)return;
  try{localStorage.setItem('deca-oferta-passkey',String(Date.now()))}catch{}
  const m=document.createElement('div');
  m.innerHTML=`<div class="modal-backdrop"><div class="modal small"><div class="modal-head"><div class="modal-title">Entra sin contraseña</div><button class="close-btn" data-cerrar>${I('x')}</button></div><div class="modal-body"><div class="inline" style="align-items:flex-start;gap:14px"><div class="stat-icon" style="flex:none">${I('key',20)}</div><div><p style="margin:0 0 8px">Crea una <strong>passkey</strong> y la próxima vez entrarás con la huella, la cara o el PIN de este dispositivo, sin escribir la contraseña.</p><p class="small muted" style="margin:0">Es más segura que una contraseña: no se puede adivinar ni robar con una web falsa, y nunca se bloquea por intentos fallidos.</p></div></div><div id="pkErr" class="error"></div></div><div class="modal-foot"><button class="btn-secondary" data-cerrar>Ahora no</button><button class="btn-primary" id="pkCrear">${I('key')} Crear passkey</button></div></div></div>`;
  const el=m.firstElementChild;document.body.appendChild(el);
  el.querySelectorAll('[data-cerrar]').forEach(b=>b.onclick=()=>el.remove());
  el.querySelector('#pkCrear').onclick=async()=>{try{await crearPasskey();state.user.passkeys=1;el.remove();toast('Passkey creada. La próxima vez pulsa «Entrar con passkey».');}catch(x){el.querySelector('#pkErr').textContent=x.message}};
}

let sugLocs=[];
const norm=t=>String(t??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const SUG_PREF={carga:['Carga y descarga','Punto de carga','Almacén propio','Cliente','Punto de descarga'],descarga:['Carga y descarga','Punto de descarga','Almacén propio','Cliente','Punto de carga'],dest:['Cliente','Carga y descarga','Punto de descarga','Almacén propio','Punto de carga']};
const locAddr=l=>[l.direccion,[l.cp,l.ciudad].filter(Boolean).join(' ')].filter(Boolean).join(', ');
const locText=(l,kind)=>kind==='dest'?(l.empresa||l.nombre):(l.nombre+(locAddr(l)?' — '+locAddr(l):''));
function suggestInput(name,label,value,kind,required=false){return `<label class="field"><span>${esc(label)}${required?` <span class="req">*</span>`:''}</span><input name="${esc(name)}" class="input" type="text" data-sug="${kind}" value="${esc(value)}" ${required?'required':''} autocomplete="off" placeholder="Escribe para buscar una ubicación…"></label>`}
let sugBox=null,sugInput=null,sugItems=[],sugIdx=-1;
function sugClose(){sugBox?.remove();sugBox=null;sugInput=null;sugItems=[];sugIdx=-1}
function sugMatches(inp){const q=norm(inp.value).trim(),pref=SUG_PREF[inp.dataset.sug]||[];
  const rank=l=>{const n=norm(l.nombre),t=pref.indexOf(l.tipo);return (q&&n.startsWith(q)?0:1)*100+(t<0?50:t)};
  return sugLocs.filter(l=>!q||norm([l.nombre,l.empresa,l.direccion,l.ciudad,l.cp].join(' ')).includes(q)).sort((a,b)=>rank(a)-rank(b)||a.nombre.localeCompare(b.nombre,'es')).slice(0,8)}
function sugPlace(){if(!sugBox||!sugInput)return;const r=sugInput.getBoundingClientRect(),below=window.innerHeight-r.bottom;sugBox.style.left=r.left+'px';sugBox.style.width=Math.max(r.width,300)+'px';sugBox.style.maxHeight=Math.max(140,Math.min(280,Math.max(below,r.top)-16))+'px';if(below<200&&r.top>below){sugBox.style.bottom=(window.innerHeight-r.top+4)+'px';sugBox.style.top='auto'}else{sugBox.style.top=(r.bottom+4)+'px';sugBox.style.bottom='auto'}}
function sugDraw(){sugBox.innerHTML=sugItems.map((l,i)=>`<div class="sug-item ${i===sugIdx?'on':''}" role="option" data-i="${i}"><div class="sug-main"><strong>${esc(l.nombre)}</strong><span class="badge gray">${esc(l.tipo)}</span></div><div class="sug-sub">${esc([l.empresa,locAddr(l)].filter(Boolean).join(' · ')||'Sin dirección')}</div></div>`).join('')}
function sugRender(inp){const items=sugMatches(inp);if(!items.length){sugClose();return}
  if(!sugBox||sugInput!==inp){sugClose();sugBox=document.createElement('div');sugBox.className='sug-box';sugBox.setAttribute('role','listbox');document.body.appendChild(sugBox);sugInput=inp}
  sugItems=items;sugIdx=-1;sugDraw();sugPlace()}
function sugPick(i){const l=sugItems[i],inp=sugInput;if(!l||!inp)return;inp.value=locText(l,inp.dataset.sug);sugClose();inp.dispatchEvent(new Event('input',{bubbles:true}))}
document.addEventListener('input',e=>{if(e.target.matches?.('input[data-sug]')&&document.activeElement===e.target)sugRender(e.target)});
document.addEventListener('focusin',e=>{if(e.target.matches?.('input[data-sug]'))sugRender(e.target)});
document.addEventListener('focusout',e=>{if(e.target===sugInput)setTimeout(()=>{if(document.activeElement!==sugInput)sugClose()},120)});
document.addEventListener('keydown',e=>{if(!sugBox||e.target!==sugInput)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sugIdx=(sugIdx+(e.key==='ArrowDown'?1:-1)+sugItems.length)%sugItems.length;sugDraw();sugBox.querySelector('.on')?.scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'&&sugIdx>=0){e.preventDefault();sugPick(sugIdx)}

async function openDocModal(d){if(!d)return;
  const gestiona=d.gestiona??perm(d.tipo+'_crear'),abierto=d.estado==='borrador'||d.estado==='emitido';
  const puedeCerrar=d.estado==='emitido'&&(gestiona||d.mio);

  if(gestiona&&d.estado==='borrador')btn.push(`<button class="btn-primary" id="emitDoc">${I('check')} Emitir</button>`);
  if(gestiona&&abierto)btn.push(`<button class="btn-secondary" id="editDoc">${I('edit')} Modificar datos</button>`,`<button class="btn-secondary" id="assignDoc">${I('user')} ${d.asignado?'Reasignar':'Asignar'}</button>`);
  if(puedeCerrar)btn.push(`<button class="${gestiona?'btn-secondary':'btn-primary'}" id="closeDoc">${I('check')} Cerrar documento</button>`);
  if(gestiona&&abierto)btn.push(`<button class="btn-danger" id="annulDoc">Anular</button>`);
  if(gestiona)btn.push(`<button class="btn-secondary" id="dupDoc">${I('copy')} Duplicar</button>`);
  const asignadoTxt=d.asignado_nombre?` · ${I('user',12)} ${esc(d.mio?'Asignado a ti':'Asignado a '+d.asignado_nombre)}`:'';
  const html=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><div class="modal-title">${esc(d.num)}</div><div class="small muted">${esc(d.datos.cliente||'')} · ${badge(d.estado)}${asignadoTxt}</div></div><button class="close-btn" id="closeModal" aria-label="Cerrar ventana">${I('x')}</button></div><div class="modal-body">${d.mio&&d.estado==='emitido'&&!gestiona?`<div class="info-note">${I('truck')}<div>Este documento está asignado a ti. Cuando termines el transporte, pulsa <strong>«Cerrar documento»</strong>.</div></div>`:''}<div class="pdf-wrap"><iframe class="pdf-frame" src="${esc(d.url)}?t=${Date.now()}"></iframe><div class="qrbox"><img src="/api/qr?u=${encodeURIComponent(d.url)}" alt="QR del documento"><div class="small muted center">Enlace público del documento</div><button class="btn-secondary btn-small full" id="copyLink">${I('copy')} Copiar enlace</button><a class="btn-secondary btn-small full" href="${esc(d.url)}" target="_blank" rel="noreferrer">${I('external')} Abrir PDF</a></div></div><div data-ext="envio-detalle"></div></div><div class="modal-foot" style="flex-wrap:wrap">${btn.join('')}<button class="btn-ghost" id="closeModal2">Cerrar ventana</button></div></div></div>`;
  const mount=document.createElement('div');mount.innerHTML=html;document.body.appendChild(mount.firstElementChild);const modal=document.body.lastElementChild;const close=()=>modal.remove();
  document.getElementById('closeModal').onclick=close;document.getElementById('closeModal2').onclick=close;
  document.getElementById('copyLink').onclick=()=>navigator.clipboard?.writeText(d.url).then(()=>toast('Enlace copiado')).catch(()=>toast(d.url));
  document.getElementById('editDoc')?.addEventListener('click',()=>{close();openEditDoc(d)});
  document.getElementById('emitDoc')?.addEventListener('click',()=>changeDocState(d,'emitido'));
  document.getElementById('annulDoc')?.addEventListener('click',()=>changeDocState(d,'anulado'));
  document.getElementById('closeDoc')?.addEventListener('click',()=>changeDocState(d,'cerrado'));
  document.getElementById('assignDoc')?.addEventListener('click',()=>{close();openAssignDoc(d)});
  document.getElementById('dupDoc')?.addEventListener('click',()=>{close();state.dup=d;if(state.hash==='nuevo-envio')renderApp();else go('nuevo-envio')});
  DECA.ext('envio.detalle',{cont:modal.querySelector('[data-ext="envio-detalle"]'),doc:d});
}
async function changeDocState(d,estado){
  let motivo='';
  if(estado==='anulado'){motivo=prompt(`Anular ${d.num}\n\nEl documento dejará de ser válido y no se podrá recuperar. Indica el motivo:`);if(motivo===null)return;if(!motivo.trim())return toast('Indica el motivo de la anulación',true);}
  else if(estado==='cerrado'){motivo=prompt(`Cerrar ${d.num}\n\n¿Ha terminado el transporte? Puedes añadir una observación (opcional):`,'');if(motivo===null)return;}
  else if(estado==='emitido'){if(!confirm(`¿Emitir ${d.num}? A partir de ahora el documento será válido para el transporte.`))return;}
  try{await api('/api/docs/'+d.id+'/estado',{method:'PATCH',body:{estado,motivo:motivo.trim()}});toast(`${d.num} ${STATUS_LABEL[estado].toLowerCase()}`);document.querySelector('.modal-backdrop')?.remove();
    if(state.hash==='inicio')pageDashboard();else pageShipments();fetchAvisos();}catch(e){toast(e.message,true);}
}
function openAssignDoc(d){
  const opts=asignables.map(u=>({value:u.id,label:`${u.nombre} (@${u.usuario})`}));
  showFormModal(`Asignar ${d.num}`,`<form id="assignForm">${selectHtml('asignado','Usuario asignado',opts,d.asignado??'',false)}<div class="field-help" style="margin-top:8px">Deja «Selecciona…» para quitar la asignación. El usuario asignado verá el documento y podrá cerrarlo.</div></form>`,async()=>{
    const v=new FormData(document.getElementById('assignForm')).get('asignado')||null;
    const r=await api('/api/docs/'+d.id+'/asignar',{method:'PATCH',body:{asignado:v}});
    toast(r.asignado?`${d.num} asignado a ${r.asignado_nombre}`:`${d.num} sin asignar`);document.querySelector('.modal-backdrop')?.remove();
    if(state.hash==='inicio')pageDashboard();else pageShipments();});
}
function openEditDoc(d){
  const fields=state.fields?.CAMPOS?.[d.tipo]||[],D=d.datos||{},esDeca=d.tipo==='deca';
  const dests=(D.destinos&&D.destinos.length?D.destinos:[D.destino]).filter(Boolean).slice();
  const plate=(key,label,list)=>pickerHtml(key,label,list.map(v=>({value:v.matricula,label:`${v.matricula} · ${v.modelo||v.tipo}`,fill:{[key]:v.matricula}})),{[key]:D[key]},[[key,'Matrícula']]);
  const trailers=vehicles.filter(v=>/remolque/i.test(v.tipo));
  const wide='style="grid-column:1/-1"';
  const parts=fields.filter(([k,,t])=>t!=='cliente').map(([k,l,t])=>{
    if(k==='destinatario')return suggestInput(k,l,D[k]||'','dest');
    if(k==='origen')return suggestInput(k,l,D[k]||'','carga');
    if(k==='destino')return `<div id="editDest" ${wide}></div>`;
    if(k==='matricula')return plate(k,l,vehicles);
    if(k==='remolque')return plate(k,l,trailers);
    if(k==='conductor_nombre')return `<div ${wide}>${pickerHtml('conductor','Conductor',drivers.filter(x=>x.activo).map(c=>({value:c.dni,label:`${c.nombre} · ${c.dni}`,fill:{conductor_nombre:c.nombre,conductor_dni:c.dni}})),{conductor_nombre:D.conductor_nombre,conductor_dni:D.conductor_dni},[['conductor_nombre','Nombre y apellidos'],['conductor_dni','DNI / NIE']])}</div>`;
    if(k==='conductor_dni')return '';
    return fieldHtml(k,l,t,D[k]||'',false);
  }).join('');
  const body=`<form id="editDocForm" class="grid grid2" autocomplete="off">${parts}<label class="field" ${wide}><span>Motivo de la modificación <span class="req">*</span></span><textarea name="motivo" class="textarea" required></textarea></label></form>`;
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><div class="modal-title">Modificar ${esc(d.num)}</div><div class="small muted">La URL y el QR del documento no cambian.</div></div><button class="close-btn" id="editClose">${I('x')}</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn-secondary" id="editCancel">Cancelar</button><button class="btn-primary" id="editSave">${I('save')} Guardar cambios</button></div></div></div>`;
  document.body.appendChild(wrap.firstElementChild);const modal=document.body.lastElementChild;const close=()=>{sugClose();modal.remove()};
  mountDestinos(document.getElementById('editDest'),dests,esDeca?'Lugares de descarga':'Lugares de entrega');
  document.getElementById('editClose').onclick=close;document.getElementById('editCancel').onclick=close;
  document.getElementById('editSave').onclick=async()=>{
    const f=document.getElementById('editDocForm');if(!f.reportValidity())return;
    const body=Object.fromEntries(new FormData(f).entries());
    body.destinos=dests.map(x=>String(x||'').trim()).filter(Boolean);body.destino=body.destinos[0]||'';
    if(!body.destinos.length)return toast(esDeca?'Indica al menos un lugar de descarga':'Indica al menos un lugar de entrega',true);
    try{await api('/api/docs/'+d.id,{method:'PUT',body});toast('Cambios guardados y PDF regenerado');close();setTimeout(()=>pageShipments(),80);}catch(e){toast(e.message,true)}};
}

async function pageUsers(){

  const perms=Object.entries((state.user||{}).PERMISOS||{});

  const tabsHtml=()=>`<div class="tabs"><button class="tab ${activeTab==='usuarios'?'active':''}" data-utab="usuarios">${I('users',16)} Usuarios del sistema <span class="pill-count">${users.length}</span></button><button class="tab ${activeTab==='auditoria'?'active':''}" data-utab="auditoria">${I('shield',16)} Auditoría de seguridad <span class="pill-count">${auditLogs.length||'Logs'}</span></button><button class="tab ${activeTab==='integraciones'?'active':''}" data-utab="integraciones">${I('key',16)} Integraciones</button><button class="tab ${activeTab==='actualizaciones'?'active':''}" data-utab="actualizaciones">${I('history',16)} Actualizaciones${upd?.disponible?' <span class="pill-count" style="background:var(--primary);color:#fff">1</span>':''}</button></div>`;
  const bindTabs=()=>document.querySelectorAll('[data-utab]').forEach(b=>b.onclick=async()=>{
    activeTab=b.dataset.utab;
    if(activeTab==='auditoria'&&!auditLogs.length){try{auditLogs=await api('/api/audit-logs');}catch{}}
    if(activeTab==='actualizaciones'){try{upd=await api('/api/actualizaciones');}catch{}}
    if(activeTab==='integraciones'){try{integ=await api('/api/integraciones');}catch{}}
    render();
  });
  const enCurso=()=>updReiniciando||(upd?.progreso&&!upd.progreso.error);
  // Mientras se instala, se consulta el estado; durante el reinicio el servidor no responde unos segundos
  const vigilar=()=>{clearInterval(updTimer);if(!enCurso())return;updTimer=setInterval(async()=>{
    if(state.hash!=='usuarios'||activeTab!=='actualizaciones'){clearInterval(updTimer);return}
    try{const r=await fetch('/api/actualizaciones',{credentials:'same-origin'});if(!r.ok)throw 0;upd=await r.json();
      if(updVersionPrevia&&upd.version!==updVersionPrevia){clearInterval(updTimer);toast(`Aplicación actualizada a la versión ${upd.version}`);setTimeout(()=>location.reload(),1200);return}
      if(updReiniciando&&upd.ultimo?.estado==='revertida'){updReiniciando=false;clearInterval(updTimer);toast('La actualización falló y se ha restaurado la versión anterior',true)}
      if(upd.progreso?.fase==='Reiniciando la aplicación')updReiniciando=true;
    }catch{if(upd?.progreso&&!upd.progreso.error)updReiniciando=true}
    render()},2000)};
  const fmtFecha=s=>s?new Date(s).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'}):'—';
  const fmtTam=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
  const renderUpd=()=>{
    const U=upd||{},d=U.disponible,p=U.progreso,ult=U.ultimo;
    let estadoHtml='';
    if(updReiniciando)estadoHtml=`<div class="alert info"><strong>Reiniciando con la nueva versión…</strong><div class="small">La aplicación volverá en unos segundos. Si algo falla, se restaurará sola la versión anterior.</div></div>`;

    if(!p||p.error){
      if(d)estadoHtml+=`<div class="alert warn"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div><strong>Nueva versión disponible: ${esc(d.version)}</strong><div class="small muted">Publicada el ${fmtFecha(d.fecha)}${d.url?` · <a class="link" href="${esc(d.url)}" target="_blank" rel="noreferrer">Ver en GitHub</a>`:''}</div></div><button class="btn-primary" id="updInstall" ${U.supervisado&&!U.desactivado?'':'disabled'}>${I('save')} Instalar ahora</button></div>${d.notas?`<div class="small" style="white-space:pre-wrap;margin-top:10px;max-height:220px;overflow:auto;border-top:1px solid var(--border);padding-top:10px">${esc(d.notas)}</div>`:''}</div>`;

    const sinSup=!U.supervisado?`<div class="info-note" style="margin-top:12px">${I('alert')}<div><strong>Las actualizaciones no se pueden instalar desde aquí</strong> porque la aplicación se ha arrancado sin el supervisor. Arráncala con <code>npm start</code> (o apunta tu servicio a <code>node scripts/supervisor.js</code>) para que pueda reiniciarse sola y restaurar la versión anterior si algo falla.</div></div>`:'';
    const des=U.desactivado?`<div class="info-note" style="margin-top:12px">${I('lock')}<div>Las actualizaciones están desactivadas en este servidor (<code>UPDATE_DISABLED=1</code>).</div></div>`:'';
    document.getElementById('view').innerHTML=`${head('Usuarios y Seguridad','Control de accesos, roles y registro de eventos del sistema',`<button class="btn-secondary" id="updCheck" ${enCurso()||U.desactivado?'disabled':''}>${I('history')} Buscar actualizaciones</button>`)}${tabsHtml()}
      <section class="card card-pad"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px"><div><div class="small muted">Versión instalada</div><div style="font-size:24px;font-weight:650">${esc(U.version||'—')}</div></div><div class="small muted right">Última comprobación: ${fmtFecha(U.ultimaComprobacion)}<br>Origen: <span class="mono">github.com/${esc(U.repo||'')}</span></div></div>${estadoHtml}${ultHtml}${sinSup}${des}</section>
      <section class="card card-pad mt4"><label class="inline" style="align-items:flex-start;cursor:pointer"><input type="checkbox" id="updAuto" ${U.auto?'checked':''} ${U.supervisado&&!U.desactivado?'':'disabled'} style="width:18px;height:18px;margin-top:2px"><span><strong>Instalar las actualizaciones automáticamente</strong><div class="small muted">La aplicación comprueba cada hora si hay una versión nueva y la instala en el horario que elijas, cuando nadie la usa. Si lo desactivas, verás un aviso y podrás instalarla tú cuando quieras.</div></span></label>${(()=>{const h=U.horario||{inicio:3,fin:5},op=v=>Array.from({length:24},(_,i)=>`<option value="${i}" ${i===v?'selected':''}>${String(i).padStart(2,'0')}:00</option>`).join('');return `<div class="inline" style="margin:12px 0 0 26px;flex-wrap:wrap"><span class="small">Instalar entre las</span><select class="select" id="updIni" style="width:auto" ${U.supervisado&&!U.desactivado?'':'disabled'}>${op(h.inicio)}</select><span class="small">y las</span><select class="select" id="updFin" style="width:auto" ${U.supervisado&&!U.desactivado?'':'disabled'}>${op(h.fin)}</select></div>`})()}<div class="small muted" style="margin:12px 0 0 26px">${I('shield',13)} ${U.firma?'Solo se instalan versiones firmadas digitalmente por el autor: si un paquete no tiene una firma válida, se rechaza.':'<span style="color:var(--danger)">Falta la clave pública de firma: no se instalará ninguna actualización.</span>'}</div></section>
      <section class="card mt4"><div class="section-head"><span class="section-title">Copias de seguridad previas a cada actualización</span></div>${(U.copias||[]).length?`<div class="data-list"><div class="data-head" style="grid-template-columns:1.3fr 1fr 120px 100px 150px"><span>Fecha</span><span>Versión</span><span>Resultado</span><span>Tamaño</span><span></span></div>${U.copias.map(c=>`<div class="data-item" style="grid-template-columns:1.3fr 1fr 120px 100px 150px"><div class="small">${fmtFecha(c.fecha)}</div><div class="small mono">${esc(c.desde)} → ${esc(c.hasta)}</div><div>${c.resultado==='completada'?'<span class="badge green">Completada</span>':c.resultado==='revertida'||c.resultado==='fallida'?'<span class="badge red">Restaurada</span>':'<span class="badge gray">En curso</span>'}</div><div class="small muted">${fmtTam(c.tamano)}</div><div><a class="btn-secondary btn-small" href="/api/actualizaciones/copias/${encodeURIComponent(c.id)}/db" download>${I('save')} Base de datos</a></div></div>`).join('')}</div>`:`<div class="empty">Todavía no se ha instalado ninguna actualización. Antes de cada una se guardará aquí una copia completa de la base de datos y del código anterior (se conservan las 3 últimas).</div>`}</section>`;
    bindTabs();

    document.getElementById('updInstall')?.addEventListener('click',async()=>{if(!confirm(`¿Instalar la versión ${d.version}?\n\nAntes se guardará una copia de seguridad de los datos. La aplicación se reiniciará y estará unos segundos sin servicio. Si la nueva versión falla, se restaurará sola la versión actual.`))return;try{updVersionPrevia=U.version;upd=await api('/api/actualizaciones/instalar',{method:'POST'});render();vigilar();}catch(x){toast(x.message,true)}});
    const guardaHorario=async()=>{const inicio=+document.getElementById('updIni').value,fin=+document.getElementById('updFin').value;if(inicio===fin){toast('La hora de inicio y la de fin no pueden ser iguales',true);return}try{upd=await api('/api/actualizaciones/config',{method:'PUT',body:{inicio,fin}});toast(`Las actualizaciones se instalarán entre las ${inicio}:00 y las ${fin}:00`);}catch(x){toast(x.message,true)}render()};
    document.getElementById('updIni')?.addEventListener('change',guardaHorario);document.getElementById('updFin')?.addEventListener('change',guardaHorario);
    document.getElementById('updAuto')?.addEventListener('change',async e=>{try{upd=await api('/api/actualizaciones/config',{method:'PUT',body:{auto:e.target.checked}});toast(e.target.checked?'Instalación automática activada':'Instalación automática desactivada');}catch(x){toast(x.message,true)}render()});
    if(enCurso()&&!updTimer)vigilar();
  };
  const renderInteg=()=>{
    const fmt=s=>s?new Date(s).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'}):'Nunca';
    document.getElementById('view').innerHTML=`${head('Usuarios y Seguridad','Control de accesos, roles y registro de eventos del sistema',`<button class="btn-primary" id="integNueva">${I('plus')} Nueva integración</button>`)}${tabsHtml()}
      <div class="info-note">${I('key')}<div>Los tokens permiten que otra aplicación (por ejemplo, el plugin <strong>7DeCA</strong> de 7Factura) <strong>lea</strong> los envíos, empresas, vehículos y conductores para facturarlos. No pueden modificar nada. Revoca un token en cuanto deje de usarse.</div></div>
      ${tokenNuevo?`<div class="alert warn"><strong>Copia ahora el token de «${esc(tokenNuevo.nombre)}»</strong>: no se volverá a mostrar.<div class="inline mt4" style="flex-wrap:wrap;width:100%"><input class="input mono" id="integToken" readonly value="${esc(tokenNuevo.token)}" style="flex:1;min-width:240px"><button class="btn-secondary" id="integCopiar">${I('copy')} Copiar</button></div><div class="small muted mt4">Dirección del gestor para la otra aplicación: <span class="mono">${esc(location.origin)}</span></div></div>`:''}
      <div class="card data-list"><div class="data-head" style="grid-template-columns:1.2fr 1fr 1.2fr 90px"><span>Nombre</span><span>Creado</span><span>Último uso</span><span></span></div>
      ${integ.map(t=>`<div class="data-item" style="grid-template-columns:1.2fr 1fr 1.2fr 90px"><div class="row-main"><div class="row-title">${esc(t.nombre)}</div><div class="row-sub mono">${esc(t.prefijo)}…</div></div><div class="small muted">${fmt(t.creado)}<br>por ${esc(t.creado_por)}</div><div class="small muted">${fmt(t.ultimo_uso)}${t.ultimo_ip?`<br><span class="mono">${esc(t.ultimo_ip)}</span>`:''}</div><div><button class="btn-danger btn-small" data-revocar="${t.id}">Revocar</button></div></div>`).join('')||'<div class="empty">No hay ninguna integración.</div>'}</div>`;
    bindTabs();
    document.getElementById('integNueva').onclick=()=>showFormModal('Nueva integración',`<form id="integForm">${fieldHtml('nombre','Nombre (para reconocerla)','text','7Factura',true)}<div class="field-help">Se generará un token de solo lectura para pegarlo en la otra aplicación.</div></form>`,async()=>{const nombre=new FormData(document.getElementById('integForm')).get('nombre');tokenNuevo=await api('/api/integraciones',{method:'POST',body:{nombre}});document.querySelector('.modal-backdrop')?.remove();integ=await api('/api/integraciones');render();});
    document.getElementById('integCopiar')?.addEventListener('click',async()=>{const i=document.getElementById('integToken');i.select();try{await navigator.clipboard.writeText(i.value);}catch{document.execCommand('copy');}toast('Token copiado');});
    document.querySelectorAll('[data-revocar]').forEach(b=>b.onclick=async()=>{const t=integ.find(x=>String(x.id)===b.dataset.revocar);if(!confirm(`¿Revocar el token «${t?.nombre}»?\n\nLa aplicación que lo use dejará de tener acceso al momento.`))return;try{await api('/api/integraciones/'+b.dataset.revocar,{method:'DELETE'});integ=await api('/api/integraciones');tokenNuevo=null;toast('Token revocado');render();}catch(x){toast(x.message,true)}});
  };
  const render=()=>{
    if(activeTab==='actualizaciones')return renderUpd();
    if(activeTab==='integraciones')return renderInteg();
    document.getElementById('view').innerHTML=`${head('Usuarios y Seguridad','Control de accesos, roles y registro de eventos del sistema',activeTab==='usuarios'?`<a class="btn-secondary" href="/api/backup" download title="Descarga una copia completa de la base de datos">${I('save')} Copia de seguridad</a><button class="btn-primary" id="addUser">${I('plus')} Dar de alta usuario</button>`:`<button class="btn-secondary" id="refreshAudit">${I('history')} Actualizar registros</button>`)}${tabsHtml()}${activeTab==='usuarios'?`<div class="card data-list"><div class="data-head" style="grid-template-columns:1.2fr 1fr 150px 110px 60px"><span>Nombre / Usuario</span><span>Contacto</span><span>Último acceso</span><span>Estado</span><span></span></div>${users.map(u=>`<div class="data-item" style="grid-template-columns:1.2fr 1fr 150px 110px 60px"><div class="row-main"><div class="row-title">${esc(u.nombre)}</div><div class="row-sub mono">@${esc(u.usuario)}</div></div><div class="small">${esc(u.email||'—')}${u.telefono?`<div class="row-sub mono">${esc(u.telefono)} ${u.telefono_verificado?'<span title="Teléfono verificado" style="color:var(--success)">✓</span>':'<span class="badge amber" style="padding:1px 6px">sin verificar</span>'}</div>`:'<div class="row-sub muted">Sin teléfono</div>'}</div><div class="small mono muted">${u.ultimo_login?`${fmtDate(u.ultimo_login)} <span style="font-size:10px">(${esc(u.ultimo_login_ip||'local')})</span>`:'Nunca'}</div><div>${u.rol==='admin'?'<span class="badge blue">Admin</span>':'<span class="badge gray">Usuario</span>'}${u.activo?'<span class="badge green" style="margin-left:4px">Activo</span>':'<span class="badge red" style="margin-left:4px">Inactivo</span>'}${u.bloqueado?'<span class="badge red" style="margin-left:4px" title="Bloqueada temporalmente por intentos fallidos">Bloqueada</span>':''}${u.passkeys?`<span class="badge blue" style="margin-left:4px" title="Passkeys registradas">${I('key',11)} ${u.passkeys}</span>`:''}</div><div class="actions"><button class="btn-secondary btn-small" data-edit-u="${u.id}">${I('edit')}</button></div></div>`).join('')||'<div class="empty">No hay usuarios dados de alta.</div>'}</div>`:`<div class="card data-list audit-list"><div class="audit-head"><span>Fecha y Hora</span><span>Usuario</span><span>IP Origen</span><span>Acción</span><span>Detalle</span><span>Nivel</span></div>${auditLogs.map(a=>`<div class="audit-item"><div class="mono small">${esc((a.fecha||'').slice(0,19).replace('T',' '))}</div><div><strong>${esc(a.usuario||'anónimo')}</strong></div><div class="mono small muted">${esc(a.ip||'—')}</div><div><span class="mono">${esc(a.accion)}</span></div><div class="small" style="color:var(--muted)">${esc(a.detalle||'—')}</div><div><span class="badge ${esc(a.severidad||'info')}">${esc(a.severidad||'info')}</span></div></div>`).join('')||'<div class="empty">No hay registros de auditoría aún.</div>'}</div>`}`;
    bindTabs();
    document.getElementById('addUser')?.addEventListener('click',()=>openUserModal(perms));
    document.getElementById('refreshAudit')?.addEventListener('click',async()=>{try{auditLogs=await api('/api/audit-logs');}catch{}render();});
    document.querySelectorAll('[data-edit-u]').forEach(b=>b.onclick=()=>openUserModal(perms,users.find(u=>String(u.id)===b.dataset.editU)));
  };
  render();
}
async function openUserModal(perms,u={permisos:[],activo:true,rol:'usuario',email:''}){
  const body=`<form id="userForm" class="grid grid2">${fieldHtml('usuario','Usuario','text',u.usuario||'',true)}${fieldHtml('nombre','Nombre completo','text',u.nombre||'',true)}${fieldHtml('email','Correo electrónico','email',u.email||'')}<div>${fieldHtml('telefono','Móvil con WhatsApp','tel',u.telefono||'')}<div class="field-help">${u.id?(u.telefono_verificado?'Verificado. Si lo cambias, tendrá que verificarlo de nuevo al entrar.':'Sin verificar: se le pedirá que lo verifique al entrar.'):'Tendrá que verificarlo al entrar por primera vez.'}</div></div>${selectHtml('rol','Rol',[{value:'usuario',label:'Usuario'},{value:'admin',label:'Administrador'}],u.rol||'usuario',true)}<div style="grid-column:1/-1">${fieldHtml('clave',u.id?'Nueva contraseña (dejar vacío para mantener la actual)':'Contraseña segura','password','')}<div class="field-help">Debe tener al menos 10 caracteres, combinando mayúsculas, minúsculas, números y símbolos (!@#$...).</div></div><label class="field" style="grid-column:1/-1"><span>Estado de la cuenta</span><select class="select" name="activo"><option value="true" ${u.activo!==false?'selected':''}>Activo (permitir acceso)</option><option value="false" ${u.activo===false?'selected':''}>Inactivo (bloquear acceso)</option></select></label><div style="grid-column:1/-1"><span style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">Permisos asignados</span><div class="grid grid2">${perms.map(([k,l])=>`<label class="inline"><input type="checkbox" name="perm_${esc(k)}" ${u.permisos?.includes(k)?'checked':''}> ${esc(l)}</label>`).join('')}</div></div>${u.bloqueado?`<label class="inline alert warn" style="grid-column:1/-1;margin:0"><input type="checkbox" name="desbloquear" checked> <span><strong>Cuenta bloqueada</strong> por intentos fallidos. Desbloquear al guardar.</span></label>`:''}${u.passkeys?`<div style="grid-column:1/-1" class="inline"><span class="small">${I('key',14)} ${u.passkeys} passkey${u.passkeys===1?'':'s'} registrada${u.passkeys===1?'':'s'}</span><button type="button" class="btn-danger btn-small" id="userPkDel">Quitar todas</button></div>`:''}</form>`;
  showFormModal(u.id?'Editar usuario':'Dar de alta usuario',body,async()=>{
    const form=document.getElementById('userForm'),fd=new FormData(form);
    const body={id:u.id,usuario:fd.get('usuario'),nombre:fd.get('nombre'),email:fd.get('email'),telefono:fd.get('telefono'),desbloquear:!!fd.get('desbloquear'),clave:fd.get('clave'),rol:fd.get('rol'),activo:fd.get('activo')!=='false',permisos:perms.filter(([k])=>form.querySelector('[name="perm_'+k+'"]')?.checked).map(([k])=>k)};
    await api('/api/usuarios',{method:'POST',body});
    toast('Usuario guardado correctamente');
    document.querySelector('.modal-backdrop')?.remove();
    await pageUsers();
  });
  document.getElementById('userPkDel')?.addEventListener('click',async e=>{if(!confirm(`¿Quitar todas las passkeys de ${u.nombre}?\n\nÚsalo si ha perdido el dispositivo. Tendrá que entrar con su contraseña y crearlas de nuevo.`))return;try{await api(`/api/usuarios/${u.id}/passkeys`,{method:'DELETE'});toast('Passkeys eliminadas');e.target.closest('.inline').remove();}catch(x){toast(x.message,true)}});
}

  v.innerHTML=`${head('Plugins','Amplía 7DeCA con funciones opcionales',st.supervisado?`<button class="btn-secondary" id="plReiniciar">${I('history')} Reiniciar la aplicación</button>`:'')}
    ${st.reinicio_pendiente?`<div class="info-note">${I('alert')}<div>Has actualizado un plugin que ya estaba cargado. <strong>Reinicia la aplicación</strong> para usar su código nuevo.</div></div>`:''}
    <div class="info-note">${I('shield')}<div>Un plugin funciona con los mismos permisos que la aplicación. Instala solo plugins del registro oficial o de autores de confianza. Los plugins y sus datos se guardan en la carpeta de datos y no se pierden al actualizar.</div></div>
    <h2 class="section-title">Instalados</h2><div class="tile-grid">${st.instalados.map(tarjeta).join('')||'<div class="card empty" style="grid-column:1/-1">No hay plugins instalados.</div>'}</div>
    <h2 class="section-title" style="margin-top:22px">Disponibles</h2>${reg.error?`<div class="card empty">No se pudo leer el registro de plugins: ${esc(reg.error)}</div>`:`<div class="tile-grid">${disponibles.map(p=>`<div class="tile-btn"><div class="tile-top"><div class="tile-icon">${I('puzzle')}</div><div class="tile-main"><div class="tile-title">${esc(p.nombre)}</div><div class="tile-sub">${esc(p.descripcion||'')}</div></div></div><div class="tile-meta"><span>Versión ${esc(p.version)}</span><span>${esc(p.autor||'')}</span></div><div class="actions mt4"><button class="btn-primary btn-small" data-inst="${esc(p.id)}">${I('plus')} Instalar</button></div></div>`).join('')||'<div class="card empty" style="grid-column:1/-1">Ya tienes instalados todos los plugins del registro.</div>'}</div>`}
    <div class="card mt4"><strong>Instalar desde un archivo</strong><div class="small muted" style="margin:6px 0 10px">Para probar un plugin propio o instalar sin conexión (paquete .tar.gz).</div><input type="file" id="plArchivo" accept=".gz,.tgz,application/gzip"></div>`;
  const tras=async(fn,ok)=>{try{const r=await fn();toast(r?.aviso||ok);DECA.cargados.clear();await cargarPluginsUI();await renderApp();}catch(e){toast(e.message,true);}};
  v.querySelectorAll('[data-inst]').forEach(b=>b.onclick=()=>{b.disabled=true;tras(()=>api(`/api/plugins/${b.dataset.inst}/instalar`,{method:'POST',body:{}}),'Plugin instalado');});
  v.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>tras(()=>api(`/api/plugins/${b.dataset.act}/activo`,{method:'POST',body:{activo:b.dataset.v==='1'}}),b.dataset.v==='1'?'Plugin activado':'Plugin desactivado'));
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('¿Desinstalar el plugin? Sus datos se conservan por si lo vuelves a instalar.'))tras(()=>api(`/api/plugins/${b.dataset.del}`,{method:'DELETE'}),'Plugin desinstalado');});
  document.getElementById('plReiniciar')?.addEventListener('click',async()=>{if(!confirm('¿Reiniciar la aplicación? Tardará unos segundos.'))return;try{await api('/api/plugins/reiniciar',{method:'POST',body:{}});toast('Reiniciando…');setTimeout(()=>location.reload(),4000);}catch(e){toast(e.message,true);}});
  document.getElementById('plArchivo').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!confirm(`¿Instalar «${f.name}»? Asegúrate de que procede de una fuente de confianza.`))return;tras(async()=>{const r=await fetch('/api/plugins/subir',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/gzip'},body:f});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo instalar');return d;},'Plugin instalado');};
}
function showFormModal(title,body,onSave){const mount=document.createElement('div');mount.innerHTML=`<div class="modal-backdrop"><div class="modal small"><div class="modal-head"><div class="modal-title">${esc(title)}</div><button class="close-btn" id="modalClose">${I('x')}</button></div><div class="modal-body">${body}<div id="formError" class="error"></div></div><div class="modal-foot"><button class="btn-secondary" id="modalCancel">Cancelar</button><button class="btn-primary" id="modalSave">${I('save')} Guardar</button></div></div></div>`;document.body.appendChild(mount.firstElementChild);const modal=document.body.lastElementChild;const close=()=>modal.remove();document.getElementById('modalClose').onclick=close;document.getElementById('modalCancel').onclick=close;document.getElementById('modalSave').onclick=async()=>{try{await onSave();}catch(e){document.getElementById('formError').textContent=e.message}}}

(async()=>{try{await bootstrap();}catch(e){console.error(e);showLogin();}})();
</script>
</body>
</html>
