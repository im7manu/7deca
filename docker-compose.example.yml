# Copia este archivo como docker-compose.yml y ajusta BASE_URL.
#
# La carpeta del proyecto se monta entera en /app para que las actualizaciones automáticas puedan
# sustituir el código (los datos están en ./data, dentro de esa misma carpeta, y nunca se tocan).
# Antes del primer arranque instala las dependencias:
#   docker compose run --rm gestor-deca npm ci --omit=dev
services:
  gestor-deca:
    build: .
    container_name: gestor_deca_ecmr
    restart: unless-stopped
    environment:
      - PORT=3000
      - BASE_URL=https://tudominio.com
      - TRUST_PROXY=1          # detrás de Caddy/nginx: IP real de los usuarios
      - TZ=Europe/Madrid       # hora local (avisos e instalación nocturna de actualizaciones)
      # - WHATSAPP_API=http://host.docker.internal:8765   # puente de WhatsApp para recuperar contraseñas
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"             # si el puente de WhatsApp está en el propio servidor
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./:/app
