# Publica una versión: al subir una etiqueta vX.Y.Z (igual a la versión de package.json) crea la Release con el
# paquete firmado. Las instalaciones la detectan en menos de una hora.
# Requiere el secreto DECA_CLAVE_FIRMA con la clave privada de firma (PEM). Sin él solo se pasan las pruebas: la versión
# se firma y publica en local (npm run release + gh release create).
name: Publicar versión
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Comprobar que la etiqueta coincide con package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then echo "La etiqueta ${GITHUB_REF_NAME} no coincide con package.json ($VERSION)"; exit 1; fi
      - run: npm ci
      - run: npm test
      - name: ¿Hay clave de firma?
        id: clave
        env:
          HAY: ${{ secrets.DECA_CLAVE_FIRMA != '' }}
        run: |
          echo "hay=$HAY" >> "$GITHUB_OUTPUT"
          if [ "$HAY" != "true" ]; then echo "::notice::Sin DECA_CLAVE_FIRMA: la Release se firma y publica en local."; fi
      - name: Empaquetar y firmar
        if: steps.clave.outputs.hay == 'true'
        env:
          DECA_CLAVE_FIRMA: ${{ secrets.DECA_CLAVE_FIRMA }}
        run: npm run release
      - name: Notas de la versión (de CHANGELOG.md)
        if: steps.clave.outputs.hay == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notas.md
          test -s notas.md || echo "Versión $VERSION" > notas.md
      - name: Crear la Release
        if: steps.clave.outputs.hay == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "7DeCA ${GITHUB_REF_NAME#v}" --notes-file notas.md --verify-tag
